# Builds FishPartners-<version>.zip and attaches it to a GitHub Release.
# Runs when a version tag (v1.2.3) is pushed, or when a release is published
# (e.g. created on github.com or via the API). WowUp installs/updates from these.
name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ github.event.release.tag_name || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Package addon
        run: |
          VERSION="${TAG#v}"
          mkdir -p build/FishPartners
          git archive HEAD | tar -x -C build/FishPartners
          rm -rf build/FishPartners/.github build/FishPartners/.gitignore build/FishPartners/CHANGELOG.md
          # stamp the tag version into the packaged TOC
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" build/FishPartners/FishPartners.toc
          (cd build && zip -qr "FishPartners-${VERSION}.zip" FishPartners)
          # release notes: this version's section from CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > build/notes.md || true
          [ -s build/notes.md ] || echo "Fish & Partners ${VERSION}" > build/notes.md
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/FishPartners-${VERSION}.zip" --clobber
            gh release edit "$TAG" --title "Fish & Partners ${VERSION}" --notes-file build/notes.md
          else
            gh release create "$TAG" "build/FishPartners-${VERSION}.zip" \
              --title "Fish & Partners ${VERSION}" \
              --notes-file build/notes.md
          fi
